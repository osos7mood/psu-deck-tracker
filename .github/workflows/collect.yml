name: Collect deck status

# GitHub skips most short scheduled runs, so instead each run stays alive
# for almost 6 hours and reads the decks every 10 minutes itself.
# A new run is queued every 2 hours, so the next one starts as soon as
# the current one ends.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Read decks every 10 minutes for about 5h40m
        run: |
          git config user.name "deck-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$((SECONDS + 340*60))
          while [ $SECONDS -lt $end ]; do
            python collector.py || echo "collector failed, trying again next round"
            git add data/deck_status.csv
            if ! git diff --cached --quiet; then
              git commit -q -m "Add deck status reading"
              git pull -q --rebase && git push -q || echo "push failed, will retry next round"
            fi
            sleep 600
          done
