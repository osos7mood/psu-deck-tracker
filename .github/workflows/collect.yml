name: Collect deck status

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:          # adds a "Run workflow" button for manual tests

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collector.py

      - name: Commit new data
        run: |
          git config user.name "deck-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deck_status.csv
          git diff --cached --quiet || git commit -m "Add deck status reading"
          git pull --rebase
          git push
